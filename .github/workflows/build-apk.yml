name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib
          flutter create --org com.alaa --project-name pixelcompress --platforms=android .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib test
          cp -r /tmp/lib lib

      - name: Patch permissions, minSdk, launch screen
        run: python3 scripts/patch_android.py

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: PixelCompress-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
