name: Build Android APK + AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib
          flutter create --org com.alaa --project-name pixelcompress --platforms=android .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib test
          cp -r /tmp/lib lib

      - name: Set up release signing (if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/upload-keystore.jks"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "$GITHUB_WORKSPACE/upload-keystore.jks" \
              > android/key.properties
            echo "Release signing: ENABLED (upload key)"
          else
            echo "Release signing: not configured (debug-signed build - NOT for Play Store)"
          fi

      - name: Patch permissions, ads, minSdk, launch screen, signing
        run: python3 scripts/patch_android.py

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release --no-shrink --build-number=${{ github.run_number }}

      - name: Build release AAB (for Google Play)
        run: flutter build appbundle --release --no-shrink --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: PixelCompress-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: PixelCompress-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # Opens the freshly built APK on an emulator and reports if it crashes.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PixelCompress-APK
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash ./scripts/smoke.sh
