name: Create upload keystore (run ONCE)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Add the KEYSTORE_PASSWORD secret first, then run this again."
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore upload-keystore.jks -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 -alias upload \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=PixelCompress, O=PixelCompress"

      - uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: upload-keystore.jks
          retention-days: 3
