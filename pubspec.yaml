name: pixelcompress
description: PixelCompress - Photo compressor, resizer, cropper and converter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  image: ^4.2.0
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3
  gal: ^2.3.1

flutter:
  uses-material-design: true
