name: pixelcompress
description: PixelCompress - Photo compressor, resizer, cropper and converter.
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  image: ^4.2.0
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3
  gal: ^2.3.1
  url_launcher: ^6.3.0
  google_mobile_ads: any

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#12141A"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
